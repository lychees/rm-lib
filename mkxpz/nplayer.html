<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mkxp-z Web Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
  #nostalgist-canvas { width: 100vw; height: 100vh; display: block; }
  #status { position: fixed; left: 10px; bottom: 10px; color: #9ca3af; font: 13px monospace; z-index: 10; }
</style>
</head>
<body>
<canvas id="nostalgist-canvas"></canvas>
<div id="status">loading mkxp-z…</div>
<script type="module">
  import { Nostalgist } from 'https://cdn.jsdelivr.net/npm/nostalgist@latest/+esm';

  (async () => {
    const q = new URLSearchParams(location.search);
    const game = q.get('game') || 'knight-blade.mkxpz';
    const needRtp = q.get('rtp') === '1';
    const status = (t) => { document.getElementById('status').textContent = t; };
    try {
      status('downloading core & game…');
      const opts = {
        core: { name: 'mkxp-z', js: './mkxp-z_libretro.js', wasm: './mkxp-z_libretro.wasm' },
        rom: 'games/' + game,
        element: '#nostalgist-canvas',
      };
      if (needRtp) {
        const rtpResp = await fetch('games/Standard.mkxpz');
        const rtpBuf = await rtpResp.arrayBuffer();
        opts.bios = { fileName: 'RTP.mkxpz', fileContent: rtpBuf };
        opts.beforeLaunch = async (nostalgist) => {
          const FS = nostalgist.getEmscriptenFS();
          const buf = new Uint8Array(rtpBuf);
          const paths = [
            '/home/web_user/retroarch/userdata/system/mkxp-z/RTP/Standard.mkxpz',
            '/home/web_user/retroarch/userdata/system/mkxp-z/RTP/RTP.mkxpz',
            '/home/web_user/retroarch/userdata/system/Standard.mkxpz',
            '/home/web_user/retroarch/userdata/system/RTP.mkxpz',
          ];
          for (const p of paths) {
            try { FS.writeFile(p, buf); } catch (e) {}
          }
        };
      }
      status('starting…');
      await Nostalgist.launch(opts);
      status('');
    } catch (e) {
      status('load failed: ' + (e && e.message ? e.message : e));
      console.error(e);
    }
  })();
</script>
</body>
</html>
