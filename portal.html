<style>
  body { margin: 0; font-family: "Microsoft YaHei", system-ui, sans-serif; background: #14161a; color: #d8dce2; padding: 24px; }

  h2 { font-size: 16px; color: #7fb3e0; margin: 22px 0 8px; }

</style>

const app = document.getElementById('app');
for (const [cat, games] of Object.entries(DATA)) {
  const h = document.createElement('h2');
  h.textContent = cat;
  app.appendChild(h);
  const grid = document.createElement('div');
  grid.className = 'grid';
  for (const [title, year, url, kind] of games) {
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = `<div class="t">${title}</div><div class="m">${year} · <span class="${kind === 'free' ? 'free' : 'paid'}">${kind === 'free' ? '免费' : '付费'}</span></div><a href="${url}" target="_blank">前往 →</a>`;

  }
  app.appendChild(grid);
}
</script>
